<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000">
  <defs>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="#1e3a5f" stroke-width="0.6" opacity="0.5"/>
    </pattern>
  </defs>
  <!-- ocean -->
  <rect width="1000" height="1000" fill="#245283"/>
  <rect width="1000" height="1000" fill="url(#grid)"/>
  <!-- mainland (stylized Leonida) -->
  <path d="M 470 120 Q 560 100 620 150 Q 700 190 690 280 Q 720 340 700 420
           Q 730 480 690 540 Q 700 620 640 680 Q 620 740 560 760
           Q 520 800 470 770 Q 420 790 400 730 Q 350 700 360 640
           Q 320 580 350 520 Q 330 440 370 390 Q 350 300 400 250
           Q 410 160 470 120 Z"
        fill="#173f2e" stroke="#2e6b4f" stroke-width="3"/>
  <!-- urban east coast -->
  <path d="M 640 300 Q 690 320 680 400 Q 700 460 670 520 Q 640 560 610 540
           Q 590 470 610 420 Q 600 350 640 300 Z"
        fill="#3a3f4a" stroke="#565d6d" stroke-width="2"/>
  <!-- wetlands west -->
  <path d="M 380 420 Q 430 400 460 450 Q 470 520 430 560 Q 380 580 360 530 Q 360 460 380 420 Z"
        fill="#1d4a35" opacity="0.85"/>
  <!-- lake -->
  <ellipse cx="520" cy="360" rx="46" ry="34" fill="#245283" stroke="#2e6b4f" stroke-width="2"/>
  <!-- keys chain SW -->
  <g fill="#173f2e" stroke="#2e6b4f" stroke-width="2">
    <ellipse cx="470" cy="830" rx="34" ry="14"/>
    <ellipse cx="530" cy="860" rx="28" ry="12"/>
    <ellipse cx="590" cy="880" rx="24" ry="10"/>
    <ellipse cx="415" cy="805" rx="22" ry="10"/>
  </g>
  <!-- keys highway -->
  <path d="M 400 795 Q 470 830 530 860 Q 570 875 610 882" fill="none" stroke="#c9a227" stroke-width="3" stroke-dasharray="10 6" opacity="0.8"/>
  <!-- highways -->
  <path d="M 470 140 Q 500 300 480 500 Q 470 640 470 770" fill="none" stroke="#c9a227" stroke-width="3" opacity="0.7"/>
  <path d="M 380 430 Q 520 440 660 430" fill="none" stroke="#c9a227" stroke-width="2.5" opacity="0.6"/>
  <!-- labels -->
  <g font-family="Arial, sans-serif" fill="#9fb8d0" opacity="0.9">
    <text x="600" y="470" font-size="22" font-weight="bold" fill="#d9e6f2">VICE CITY</text>
    <text x="470" y="290" font-size="16">Mount Kalaga</text>
    <text x="370" y="500" font-size="16">Grassrivers</text>
    <text x="404" y="620" font-size="16">Port Gellhorn</text>
    <text x="500" y="920" font-size="18">LEONIDA KEYS</text>
    <text x="150" y="150" font-size="13" opacity="0.55">PLACEHOLDER — community map tiles land here</text>
  </g>
</svg>
